name: Crea programma Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Installa strumenti di compilazione
        run: python -m pip install -r requirements.txt "pyinstaller>=6,<7" reportlab
      - name: Verifica regole di riconciliazione
        run: python -m unittest -v test_core.py
      - name: Crea eseguibile autonomo
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name RiconciliaPOS --add-data "static:static" --collect-all pdfplumber --collect-all pypdfium2 desktop.py
      - name: Prova il programma compilato
        run: python scripts/windows_smoke.py
      - name: Aggiungi istruzioni
        run: Copy-Item WINDOWS-LEGGIMI.txt dist/RiconciliaPOS/LEGGIMI.txt
      - name: Pubblica ZIP scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: RiconciliaPOS-Windows
          path: dist/RiconciliaPOS/
          if-no-files-found: error
          retention-days: 30
